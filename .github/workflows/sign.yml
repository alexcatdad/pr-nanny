name: Sign qualified packages
on:
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: Successful Validate workflow run ID from a push to main
        required: true
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: sign-${{ inputs.qualification_run_id }}
  cancel-in-progress: false
jobs:
  preflight:
    name: Verify qualification run and signing configuration
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_id: ${{ steps.gate.outputs.run_id }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      mac_configured: ${{ steps.credentials.outputs.mac_configured }}
      windows_configured: ${{ steps.credentials.outputs.windows_configured }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify successful main Validate run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.qualification_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "qualification_run_id must be a numeric GitHub Actions run ID." >&2
            exit 1
          fi
          sha=$(sh scripts/qualify-release.sh "$RUN_ID")
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "head_sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Detect available signing secrets
        id: credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mac_configured=false
          windows_configured=false
          if [[ -n "$MACOS_CERTIFICATE_P12_BASE64" && -n "$MACOS_CERTIFICATE_PASSWORD" && -n "$MACOS_SIGNING_IDENTITY" && -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            mac_configured=true
          else
            echo "::notice::macOS signing skipped: configure all six MACOS/APPLE secrets listed in build/SIGNING.md."
          fi
          if [[ -n "$WINDOWS_CERTIFICATE_PFX_BASE64" && -n "$WINDOWS_CERTIFICATE_PASSWORD" ]]; then
            windows_configured=true
          else
            echo "::notice::Windows signing skipped: configure both WINDOWS_CERTIFICATE secrets listed in build/SIGNING.md."
          fi
          echo "mac_configured=$mac_configured" >> "$GITHUB_OUTPUT"
          echo "windows_configured=$windows_configured" >> "$GITHUB_OUTPUT"

  macos:
    name: Sign and notarize macOS app
    needs: preflight
    if: needs.preflight.outputs.mac_configured == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout qualified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          persist-credentials: false
      - name: Download macOS package from selected run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-macOS-ARM64
          path: ${{ runner.temp }}/pr-nanny-source
          run-id: ${{ needs.preflight.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Sign, notarize, staple, verify, and repackage
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sh scripts/read-version.sh)
          SOURCE="$RUNNER_TEMP/pr-nanny-source"
          WORK="$RUNNER_TEMP/pr-nanny-signing"
          OUTPUT="$RUNNER_TEMP/pr-nanny-signed"
          KEYCHAIN="$RUNNER_TEMP/pr-nanny-signing.keychain-db"
          CERT="$RUNNER_TEMP/pr-nanny-signing.p12"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          ORIGINAL_KEYCHAINS=()
          while IFS= read -r keychain; do ORIGINAL_KEYCHAINS+=("$keychain"); done < <(security list-keychains -d user | sed -E 's/^ *"(.*)"$/\1/')
          mkdir -p "$WORK" "$OUTPUT"
          cleanup() {
            security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}" >/dev/null 2>&1 || true
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$CERT"
            rm -rf "$WORK"
          }
          trap cleanup EXIT

          sh scripts/verify-package.sh "$SOURCE"
          ARCHIVE="$SOURCE/pr-nanny-$VERSION-darwin-arm64.zip"
          unzip -q "$ARCHIVE" -d "$WORK"
          APP="$WORK/PR Nanny.app"
          test -x "$APP/Contents/MacOS/pr-nanny"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-keychain-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$MACOS_SIGNING_IDENTITY"

          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$APP/Contents/MacOS/pr-nanny"
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$WORK/pr-nanny-notarize.zip"
          xcrun notarytool submit "$WORK/pr-nanny-notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait --timeout 20m
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

          FINAL="$OUTPUT/pr-nanny-$VERSION-darwin-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$FINAL"
          (cd "$OUTPUT" && shasum -a 256 "$(basename "$FINAL")" > "$(basename "$FINAL").sha256")
          (cd "$OUTPUT" && shasum -a 256 -c "$(basename "$FINAL").sha256")
      - name: Upload signed macOS artifact (not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-package-macOS-ARM64
          path: ${{ runner.temp }}/pr-nanny-signed/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Sign Windows executable
    needs: preflight
    if: needs.preflight.outputs.windows_configured == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout qualified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          persist-credentials: false
      - name: Download Windows package from selected run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-Windows-X64
          path: ${{ runner.temp }}\pr-nanny-source
          run-id: ${{ needs.preflight.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Authenticode-sign and verify executable
        id: signed
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Version = (Get-Content -Raw VERSION).Trim()
          $Source = Join-Path $env:RUNNER_TEMP 'pr-nanny-source'
          $Output = Join-Path $env:RUNNER_TEMP 'pr-nanny-signed'
          $Work = Join-Path $env:RUNNER_TEMP 'pr-nanny-signing'
          $Certificate = Join-Path $env:RUNNER_TEMP 'pr-nanny-signing.pfx'
          $Archive = Join-Path $Source "pr-nanny-$Version-windows-x64.zip"
          $Checksum = "$Archive.sha256"
          New-Item -ItemType Directory -Force -Path $Output, $Work | Out-Null
          try {
            if (-not (Test-Path -LiteralPath $Archive) -or -not (Test-Path -LiteralPath $Checksum)) { throw 'The selected qualification run is missing the Windows archive or checksum.' }
            $Expected = ((Get-Content -Raw -LiteralPath $Checksum).Trim() -split '\s+')[0].ToLowerInvariant()
            $Actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $Archive).Hash.ToLowerInvariant()
            if ($Expected -notmatch '^[0-9a-f]{64}$' -or $Expected -ne $Actual) { throw 'The source archive SHA-256 check failed.' }

            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $Zip = [System.IO.Compression.ZipFile]::OpenRead($Archive)
            try {
              $Names = @($Zip.Entries | ForEach-Object { $_.FullName })
              foreach ($Name in $Names) {
                if ([IO.Path]::IsPathRooted($Name) -or $Name -match '(^|[/\\])\.\.([/\\]|$)') { throw "Unsafe zip entry: $Name" }
              }
              if ($Names.Count -ne 5) { throw 'The Windows archive contains unexpected entries.' }
              foreach ($Required in @('pr-nanny.exe','LICENSE','README.txt','install.ps1','uninstall.ps1')) {
                if ($Names -notcontains $Required) { throw "Missing expected archive entry: $Required" }
              }
            } finally { $Zip.Dispose() }

            [IO.File]::WriteAllBytes($Certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
            Expand-Archive -LiteralPath $Archive -DestinationPath $Work -Force
            $Executable = Join-Path $Work 'pr-nanny.exe'
            $SignTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction Stop |
              Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
              Select-Object -First 1 -ExpandProperty FullName
            & $SignTool sign /f $Certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $Executable
            if ($LASTEXITCODE -ne 0) { throw 'SignTool failed to sign the executable.' }
            & $SignTool verify /pa /all /v $Executable
            if ($LASTEXITCODE -ne 0) { throw 'SignTool could not verify the Authenticode signature.' }

            $Final = Join-Path $Output "pr-nanny-$Version-windows-x64.zip"
            Compress-Archive -Path (Join-Path $Work '*') -DestinationPath $Final -CompressionLevel Optimal
            $Hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $Final).Hash.ToLowerInvariant()
            Set-Content -Encoding ascii -NoNewline -LiteralPath "$Final.sha256" -Value "$Hash  $(Split-Path -Leaf $Final)`n"
            $SidecarHash = ((Get-Content -Raw -LiteralPath "$Final.sha256").Trim() -split '\s+')[0].ToLowerInvariant()
            $FinalHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $Final).Hash.ToLowerInvariant()
            if ($FinalHash -ne $SidecarHash) { throw 'The signed archive SHA-256 verification failed.' }
          } finally {
            Remove-Item -LiteralPath $Certificate -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $Work -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Upload signed Windows artifact (not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-package-Windows-X64
          path: ${{ runner.temp }}\pr-nanny-signed\*
          if-no-files-found: error
          retention-days: 14
