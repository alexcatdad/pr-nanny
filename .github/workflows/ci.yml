name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frontend:
    name: Frontend and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm check && pnpm test && pnpm audit --audit-level=low && pnpm build
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-test-evidence
          path: |
            frontend/playwright-report/
            frontend/screenshots/
          retention-days: 14
  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            package: darwin
          - os: windows-2025
            package: windows
          - os: ubuntu-24.04
            package: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - run: npm install --global pnpm@11.25.0
      - name: Install Linux GUI and test-vault dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsecret-1-dev libxdo-dev xvfb dbus-x11 gnome-keyring apparmor
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: frontend
      - name: Native adapter race tests
        run: go test -race -tags production .
      - name: Go unit, integration and race tests
        run: go test -race ./internal/...
      - name: Native Windows credential vault roundtrip
        if: runner.os == 'Windows'
        env:
          PR_NANNY_TEST_NATIVE_VAULT: '1'
        run: go test ./internal/auth -run '^TestNativeStore' -count=1 -v
      - name: Native macOS credential vault roundtrip
        if: runner.os == 'macOS'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/pr-nanny-test.keychain-db"
          previous=$(security default-keychain -d user | sed -E 's/^ *"(.*)"$/\1/')
          previous_search=()
          while IFS= read -r item; do previous_search+=("$item"); done < <(security list-keychains -d user | sed -E 's/^ *"(.*)"$/\1/')
          trap 'security list-keychains -d user -s "${previous_search[@]}"; security default-keychain -d user -s "$previous"; security delete-keychain "$keychain"' EXIT
          security create-keychain -p fixture-password "$keychain"
          security unlock-keychain -p fixture-password "$keychain"
          security default-keychain -d user -s "$keychain"
          security list-keychains -d user -s "$keychain"
          PR_NANNY_TEST_NATIVE_VAULT=1 go test ./internal/auth -run '^TestNativeStore' -count=1 -v
      - name: Native Linux credential vault roundtrip
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- sh -c 'printf "%s" fixture-password | gnome-keyring-daemon --unlock --components=secrets >/dev/null; PR_NANNY_TEST_NATIVE_VAULT=1 go test ./internal/auth -run "^TestNativeStore" -count=1 -v'
      - name: Package macOS or Linux production app
        if: runner.os != 'Windows'
        run: sh scripts/package.sh 0.1.0-rc.1 ${{ matrix.package }}
      - name: Package Windows production app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version 0.1.0-rc.1
      - name: Production capabilities check
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            sh scripts/check-production.sh bin/pr-nanny.exe
          else
            sh scripts/check-production.sh bin/pr-nanny
          fi
      - name: Scan the native application and Wails dependency
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary bin/pr-nanny.exe
          else
            go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary bin/pr-nanny
          fi
      - name: Static analysis of native adapter and renderer boundary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            go -C tools/security build -o ../../gosec.exe github.com/securego/gosec/v2/cmd/gosec
            ./gosec.exe -tags production .
          else
            go -C tools/security build -o ../../gosec github.com/securego/gosec/v2/cmd/gosec
            ./gosec -tags production .
          fi
      - name: Allow this Linux executable to create its WebKit sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sh scripts/apparmor-profile.sh "$PWD/bin/pr-nanny" > "$RUNNER_TEMP/pr-nanny.apparmor"
          sudo install -m 644 "$RUNNER_TEMP/pr-nanny.apparmor" /etc/apparmor.d/pr-nanny
          sudo apparmor_parser -r /etc/apparmor.d/pr-nanny
      - name: Launch actual native app and verify embedded frontend IPC
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dbus-run-session -- ./bin/pr-nanny --smoke-test
          elif [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -Command '$p = Start-Process ./bin/pr-nanny.exe -ArgumentList "--smoke-test" -PassThru -Wait; exit $p.ExitCode'
          else
            unzip -q dist/pr-nanny-0.1.0-rc.1-darwin-arm64.zip -d "$RUNNER_TEMP/pr-nanny-smoke"
            "$RUNNER_TEMP/pr-nanny-smoke/PR Nanny.app/Contents/MacOS/pr-nanny" --smoke-test
          fi
      - name: Verify macOS or Linux release artifact
        if: runner.os != 'Windows'
        run: sh scripts/verify-package.sh dist
      - name: Verify Windows release artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-package-windows.ps1 -Archive dist/pr-nanny-0.1.0-rc.1-windows-x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  security:
    name: Security gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify modules
        run: go mod verify
      - name: Verify release qualification rejects incomplete or untrusted runs
        run: sh scripts/test-qualification.sh
      - name: Validate workflow definitions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -shellcheck= -pyflakes=
      - name: Vet platform-independent backend
        run: go vet ./internal/...
      - name: Vulnerable dependency and code paths
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./internal/...
      - name: Static security analysis
        run: |
          go -C tools/security build -o ../../gosec github.com/securego/gosec/v2/cmd/gosec
          ./gosec ./internal/...
