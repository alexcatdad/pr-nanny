# Validation only: every job calls alexcatdad/ci-actions with repository-owned
# task commands. The runner image has no Task binary, so each command runs a
# pinned go-task through go run. Nothing here publishes, tags, signs or releases.
name: Validation
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
permissions: {}
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: alexcatdad/ci-actions/.github/workflows/validate-pr.yml@9e1ecd0470a455c5a55de0b67413d29e7205b71f
    with:
      runner: macos-26
      go-version: '1.27.3'
      lint-command: go run github.com/go-task/task/v3/cmd/task@v3.54.0 lint
      build-command: go run github.com/go-task/task/v3/cmd/task@v3.54.0 build
      test-command: go run github.com/go-task/task/v3/cmd/task@v3.54.0 test
      # Prose no lint, build or test command reads. LICENSE is left out: it is
      # copied into the app bundle.
      inert-paths: |
        README.md
        CHANGELOG.md
        CONTRIBUTING.md
        SECURITY.md
        CODE_OF_CONDUCT.md
        ARCHITECTURE.md
        SPEC.md
        AGENTS.md
        docs/**
  main:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      contents: read
    uses: alexcatdad/ci-actions/.github/workflows/validate-main.yml@9e1ecd0470a455c5a55de0b67413d29e7205b71f
    with:
      runner: macos-26
      go-version: '1.27.3'
      test-command: go run github.com/go-task/task/v3/cmd/task@v3.54.0 test
      integration-command: go run github.com/go-task/task/v3/cmd/task@v3.54.0 test:integration
      security-command: go run github.com/go-task/task/v3/cmd/task@v3.54.0 security
  codeql:
    # The one allowed write scope: uploading code scanning results.
    permissions:
      contents: read
      security-events: write
    uses: alexcatdad/ci-actions/.github/workflows/codeql.yml@9e1ecd0470a455c5a55de0b67413d29e7205b71f
    with:
      languages: '["actions", "go", "swift", "javascript-typescript"]'
      swift-build-command: swift build --package-path macos
