version: "3"

# Local releases only. CI (.github/workflows/validation.yml) calls the
# lint/build/test/security tasks through alexcatdad/ci-actions and never
# releases. See CONTRIBUTING.md "Releases".

vars:
  RELTOOL_TAG: v0.2.0
  RELTOOL_COMMIT: 6036a85828711fbfb908f67e159482597c4434c0 # commit of RELTOOL_TAG
  RELTOOL_SRC: ../release-tools
  RELTOOL:
    sh: echo "${XDG_CACHE_HOME:-$HOME/.cache}/release-tools/{{.RELTOOL_COMMIT}}/reltool"
  VERSION:
    sh: sh scripts/read-version.sh
  GITLEAKS: github.com/zricethezav/gitleaks/v8@v8.30.1
  GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@v1.9.0
  ACTIONLINT: github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

tasks:
  # --- local gate; CI runs the same tasks ---
  check:
    desc: Everything CI runs - lint, build, tests (incl. browser e2e) and security scans
    cmds:
      - task: lint
      - task: build
      - task: test
      - task: test:integration
      - task: security

  lint:
    desc: Formatting, go vet, golangci-lint, shellcheck, actionlint, zizmor and frontend lint/type check
    cmds:
      - task: tools:install
      - test -z "$(git ls-files '*.go' | xargs gofmt -l)" || { git ls-files '*.go' | xargs gofmt -l; echo 'Run gofmt on the files above' >&2; exit 1; }
      - go vet ./internal/... ./cmd/...
      - task: frontend:dist
      - go vet -tags production .
      - go -C tools/lint build -o ../../.tools/golangci-lint github.com/golangci/golangci-lint/v2/cmd/golangci-lint
      - .tools/golangci-lint run --config .golangci.yml ./internal/... ./cmd/...
      - .tools/shellcheck scripts/*.sh
      - PATH="$PWD/.tools:$PATH" go run {{.ACTIONLINT}} -pyflakes=
      - .tools/zizmor --offline --no-progress --min-severity low .github/workflows
      - cd frontend && pnpm lint && pnpm check

  build:
    desc: Build the production helper and the production Wails app
    cmds:
      - task: frontend:dist
      - mkdir -p bin
      - CGO_ENABLED=0 go build -tags production -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o bin/pr-nanny-helper ./cmd/pr-nanny-helper
      - MACOSX_DEPLOYMENT_TARGET=13.0 CGO_CFLAGS="-mmacosx-version-min=13.0" CGO_LDFLAGS="-mmacosx-version-min=13.0" go build -tags production -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o bin/pr-nanny .
      - sh scripts/check-production.sh bin/pr-nanny

  test:
    desc: Go race tests with the coverage floor, native adapter tests and frontend unit tests
    cmds:
      - sh scripts/coverage-go.sh
      - go test -race ./cmd/...
      - task: frontend:dist
      - go test -race -tags production .
      - cd frontend && pnpm test

  test:integration:
    desc: Frontend browser tests against the mock bridge (Playwright Chromium)
    cmds:
      - task: frontend:install
      - cd frontend && pnpm exec playwright install chromium && pnpm test:e2e

  security:
    desc: gitleaks, go mod verify, govulncheck, gosec and the frontend dependency audit
    cmds:
      - go run {{.GITLEAKS}} git --no-banner --redact .
      - go mod verify
      - task: frontend:dist
      - go run {{.GOVULNCHECK}} ./...
      - go -C tools/security build -o ../../.tools/gosec github.com/securego/gosec/v2/cmd/gosec
      - .tools/gosec -quiet ./internal/... ./cmd/...
      - .tools/gosec -quiet -tags production .
      - cd frontend && pnpm audit --audit-level=low

  tools:install:
    internal: true
    cmds:
      - sh scripts/install-ci-tools.sh

  frontend:install:
    internal: true
    cmds:
      - cd frontend && pnpm install --frozen-lockfile

  frontend:dist:
    internal: true
    deps: [frontend:install]
    # Always rebuild: Playwright replaces frontend/dist with a fixture build.
    cmds:
      - cd frontend && pnpm build

  # --- app-owned release tasks, called by reltool from release.json ---
  build:darwin-arm64:
    desc: Build, sign (when MACOS_SIGNING_IDENTITY is set) and package the macOS app zip
    cmds:
      - task: frontend:install
      - sh scripts/package.sh "$RELEASE_VERSION" darwin
      - cp "dist/pr-nanny-$RELEASE_VERSION-darwin-arm64.zip" "$RELEASE_OUT/"

  validate:darwin-arm64:
    cmds:
      - sh scripts/verify-package.sh dist
      - sh scripts/check-production.sh bin/pr-nanny
      - |
        smoke=$(mktemp -d)
        trap 'rm -rf "$smoke"' EXIT
        ditto -x -k "dist/pr-nanny-$RELEASE_VERSION-darwin-arm64.zip" "$smoke"
        "$smoke/PR Nanny.app/Contents/MacOS/pr-nanny" --smoke-test

  # --- release-tools consumer snippet (docs/consumer.md in release-tools) ---
  reltool:install:
    internal: true
    status:
      - test -x "{{.RELTOOL}}"
    cmds:
      - git -C "{{.RELTOOL_SRC}}" show "{{.RELTOOL_COMMIT}}:scripts/install-reltool.sh" | sh -s -- "{{.RELTOOL_SRC}}" "{{.RELTOOL_TAG}}" "{{.RELTOOL_COMMIT}}"

  release:check:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release check --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:prepare:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release prepare --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release run --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:resume:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release resume --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:abandon:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release abandon {{.CLI_ARGS}}'
