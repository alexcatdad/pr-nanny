version: "3"

# Local releases only. CI (.github/workflows/validation.yml) calls the
# lint/build/test/security tasks through alexcatdad/ci-actions and never
# releases. See CONTRIBUTING.md "Releases".

vars:
  RELTOOL_TAG: v0.4.1
  RELTOOL_COMMIT: e5dbed8034b899e5a7091ef1d3edf8e8da7989ab # commit of RELTOOL_TAG
  # The release-tools checkout. Defaults to the workspace layout
  # (REPOS/alexcatdad/infrastructure/release-tools); override with
  # RELTOOL_SRC=/path in the environment or `task release RELTOOL_SRC=/path`.
  RELTOOL_SRC: '{{.RELTOOL_SRC | default "../../../infrastructure/release-tools"}}'
  RELTOOL:
    sh: echo "${XDG_CACHE_HOME:-$HOME/.cache}/release-tools/{{.RELTOOL_COMMIT}}/reltool"
  VERSION:
    sh: sh scripts/read-version.sh
  GITLEAKS: github.com/zricethezav/gitleaks/v8@v8.30.1
  GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@v1.9.0
  ACTIONLINT: github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

tasks:
  # --- local gate; CI runs the same tasks ---
  check:
    desc: Everything CI runs - lint, build, tests (incl. the bundle smoke test) and security scans
    cmds:
      - task: lint
      - task: build
      - task: test
      - task: test:integration
      - task: security

  lint:
    desc: gofmt, go vet, golangci-lint, swift-format, shellcheck, actionlint and zizmor
    cmds:
      - task: tools:install
      - test -z "$(git ls-files '*.go' | xargs gofmt -l)" || { git ls-files '*.go' | xargs gofmt -l; echo 'Run gofmt on the files above' >&2; exit 1; }
      - go vet ./...
      - go -C tools/lint build -o ../../.tools/golangci-lint github.com/golangci/golangci-lint/v2/cmd/golangci-lint
      - .tools/golangci-lint run --config .golangci.yml ./...
      - swift format lint --strict --recursive macos/Package.swift macos/Sources macos/Tests
      - .tools/shellcheck scripts/*.sh macos/Scripts/*.sh
      - PATH="$PWD/.tools:$PATH" go run {{.ACTIONLINT}} -pyflakes=
      - .tools/zizmor --offline --no-progress --min-severity low .github/workflows

  build:
    desc: Build the production helper and the Swift app and tests with warnings as errors
    cmds:
      - mkdir -p bin
      - CGO_ENABLED=0 go build -tags production -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o bin/pr-nanny-helper ./cmd/pr-nanny-helper
      - sh scripts/check-production.sh bin/pr-nanny-helper
      - swift build --package-path macos --build-tests -Xswiftc -warnings-as-errors

  test:
    desc: Go race tests and Swift tests (warnings as errors), each with a coverage floor
    cmds:
      - sh scripts/coverage-go.sh
      - go test -race ./cmd/...
      - sh scripts/coverage-swift.sh

  test:integration:
    desc: Build the dev bundle, validate it and run its headless smoke test against the bundled helper
    cmds:
      - sh macos/Scripts/test-package-app.sh

  security:
    desc: gitleaks, go mod verify, govulncheck and gosec
    cmds:
      - go run {{.GITLEAKS}} git --no-banner --redact .
      - go mod verify
      - go run {{.GOVULNCHECK}} ./...
      - go -C tools/security build -o ../../.tools/gosec github.com/securego/gosec/v2/cmd/gosec
      - .tools/gosec -quiet ./internal/... ./cmd/...

  dev:app:
    desc: Build 'PR Nanny Dev.app' (bundle ID com.alexcatdad.pr-nanny.dev) into macos/.build/dev
    cmds:
      - sh macos/Scripts/dev-app.sh

  dev:run:
    desc: Build and launch 'PR Nanny Dev.app'
    cmds:
      - sh macos/Scripts/dev-app.sh --run

  tools:install:
    internal: true
    cmds:
      - sh scripts/install-ci-tools.sh

  # --- app-owned release tasks, called by reltool from release.json ---
  build:darwin-arm64:
    desc: Build, sign (Developer ID when MACOS_SIGNING_IDENTITY is set) and zip PR Nanny.app
    cmds:
      - sh scripts/package.sh "$RELEASE_VERSION" darwin
      - cp "dist/pr-nanny-$RELEASE_VERSION-darwin-arm64.zip" "$RELEASE_OUT/"

  validate:darwin-arm64:
    cmds:
      - sh scripts/verify-package.sh dist
      - |
        smoke=$(mktemp -d)
        trap 'rm -rf "$smoke"' EXIT
        ditto -x -k "dist/pr-nanny-$RELEASE_VERSION-darwin-arm64.zip" "$smoke"
        APP_VERSION="$RELEASE_VERSION" sh macos/Scripts/validate-bundle.sh "$smoke/PR Nanny.app"
        sh scripts/check-production.sh "$smoke/PR Nanny.app/Contents/Helpers/pr-nanny-helper"
        "$smoke/PR Nanny.app/Contents/MacOS/PRNanny" --smoke-test

  # --- release-tools consumer snippet (docs/consumer.md in release-tools) ---
  reltool:install:
    internal: true
    status:
      - test -x "{{.RELTOOL}}"
    cmds:
      - |
        git -C "{{.RELTOOL_SRC}}" rev-parse --git-dir >/dev/null 2>&1 || {
          echo 'release-tools checkout not found at {{.RELTOOL_SRC}}. Clone alexcatdad/release-tools there or set RELTOOL_SRC=/path/to/release-tools.' >&2
          exit 1
        }
      - git -C "{{.RELTOOL_SRC}}" show "{{.RELTOOL_COMMIT}}:scripts/install-reltool.sh" | sh -s -- "{{.RELTOOL_SRC}}" "{{.RELTOOL_TAG}}" "{{.RELTOOL_COMMIT}}"

  release:check:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release check --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:prepare:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release prepare --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release run --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:resume:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release resume --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:abandon:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release abandon {{.CLI_ARGS}}'
